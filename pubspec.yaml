name: voltmatch
description: "Know Before You Connect - USB-PD Compatibility Checker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#101419"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#101419"
    theme_color: "#22BFA2"

flutter:
  uses-material-design: true
  assets:
    - assets/data/devices.json
    - assets/data/chargers.json